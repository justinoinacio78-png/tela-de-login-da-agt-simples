<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Contribuinte AGT</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>

    <article>
        <h1>Bem-vindo</h1>
        <p>Desfrute dos serviços da <strong>AGT</strong> com um único login! A melhor <strong>experiência tributária</strong> para você, <strong>Caro Contribuinte.</strong></p>
    </article>
    <main>
        <section>
            <img src="img/agt-banner-blue.png" alt="Logo da AGT">
            <p>Inicie sessão com múltplas formas de acesso e mantenha-se por dentro da actividade tributária</p>
            <input type="text" name="nif" id="nif" placeholder="Digite o seu NIF" maxlength="15">
            <input type="button" value="Seguinte" id="next">
            <p>ou</p>
            <input type="button" value="Portal do Contribuinte" id="btn">
        </section>
    </main>
</body>
</html>
